
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Prakriti 💖</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(
                135deg, #ff758c, #ff7eb3, #a18cd1, #fbc2eb
            );
            background-size: 300% 300%;
            animation: gradient 8s ease infinite;
            overflow: hidden;
        }

        @keyframes gradient {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            width: 90%;
            max-width: 550px;
            padding: 50px 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            box-shadow: 0 15px 45px rgba(80, 20, 80, 0.25);
            animation: appear 1.5s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .flower {
            font-size: 65px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        h1 {
            color: white;
            font-size: clamp(2rem, 7vw, 3.5rem);
            margin: 20px 0;
            text-shadow: 2px 4px 12px rgba(100, 0, 70, 0.3);
        }

        h1 span {
            color: #fff4a3;
        }

        p {
            color: white;
            font-size: 1.15rem;
            line-height: 1.8;
            margin-bottom: 28px;
        }

        button {
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            background: white;
            color: #d63384;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
            background: #fff4a3;
        }

        #message {
            margin-top: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
        }

        .heart {
            position: absolute;
            bottom: -40px;
            font-size: 25px;
            animation: rise 7s linear infinite;
            pointer-events: none;
        }

        @keyframes rise {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            20% { opacity: 1; }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="flower">🌸</div>

        <h1>Hello, <span>Prakriti!</span></h1>

        <p>
            ✨ Welcome to this beautiful page! ✨<br>
            A special place filled with smiles, happiness,
            and positive vibes. 💖
        </p>

        <button onclick="showMessage()">
            Click for a Surprise 🎁
        </button>

        <div id="message"></div>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "🎉 Yay, Prakriti! You're amazing! 🌈💖";
        }

        // Floating hearts and sparkles
        const symbols = ["💖", "✨", "🌸", "💕", "⭐"];

        function createHeart() {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.textContent =
                symbols[Math.floor(Math.random() * symbols.length)];

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration =
                (4 + Math.random() * 5) + "s";
            heart.style.fontSize =
                (18 + Math.random() * 20) + "px";

            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 9000);
        }

        setInterval(createHeart, 500);
    </script>
</body>
</html>
